<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芒果訂購</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-amber-50 min-h-screen">

  <!-- Header -->
  <header class="bg-amber-500 text-white py-4 px-4 shadow-md">
    <h1 class="text-2xl font-bold text-center">🥭 芒果訂購</h1>
  </header>

  <!-- 公告 -->
  <div id="announcement" class="hidden bg-amber-100 border-l-4 border-amber-500 text-amber-800 p-3 mx-4 mt-4 rounded-r text-sm max-w-2xl sm:mx-auto"></div>

  <!-- Tab 切換 -->
  <nav class="flex mx-4 mt-4 border-b border-amber-300 max-w-2xl sm:mx-auto">
    <button id="tab-order" class="tab-btn active flex-1 py-3 text-center font-semibold text-amber-800 border-b-2 border-amber-500 bg-white rounded-t-lg" onclick="switchTab('order')">
      訂購
    </button>
    <button id="tab-query" class="tab-btn flex-1 py-3 text-center font-semibold text-gray-500 bg-amber-100 rounded-t-lg" onclick="switchTab('query')">
      查詢訂單
    </button>
  </nav>

  <!-- ==================== 訂購區 ==================== -->
  <main id="section-order" class="px-4 py-6 max-w-2xl mx-auto">

    <!-- 商品載入中 -->
    <div id="products-loading" class="space-y-4">
      <div class="bg-white rounded-xl p-4 shadow animate-pulse">
        <div class="h-5 bg-gray-200 rounded w-1/3 mb-3"></div>
        <div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
      </div>
      <div class="bg-white rounded-xl p-4 shadow animate-pulse">
        <div class="h-5 bg-gray-200 rounded w-1/3 mb-3"></div>
        <div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
      </div>
    </div>

    <!-- 商品列表 -->
    <div id="products-container" class="space-y-4 hidden"></div>

    <!-- 載入失敗 -->
    <div id="products-error" class="hidden bg-red-50 text-red-700 p-4 rounded-xl text-center">
      <p>商品載入失敗，請重新整理頁面</p>
      <button onclick="location.reload()" class="mt-2 text-sm underline">重新整理</button>
    </div>

    <!-- 訂單摘要 -->
    <div id="order-summary" class="hidden bg-white rounded-xl shadow p-4 mt-6 sticky bottom-4">
      <h3 class="font-bold text-amber-800 mb-2">訂單摘要</h3>
      <div id="summary-items" class="text-sm space-y-1"></div>
      <div class="border-t border-gray-200 mt-2 pt-2 flex justify-between font-bold text-lg text-amber-800">
        <span>合計</span>
        <span id="summary-total">$0</span>
      </div>
    </div>

    <!-- 訂購人資訊 -->
    <section class="bg-white rounded-xl shadow p-4 mt-6">
      <h3 class="font-bold text-amber-800 mb-3">訂購人資訊</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="buyer-name" class="form-input" placeholder="請輸入姓名">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">電話 <span class="text-red-500">*</span></label>
          <input type="tel" id="buyer-phone" class="form-input" placeholder="例：0912345678">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">地址 <span class="text-red-500">*</span></label>
          <input type="text" id="buyer-address" class="form-input" placeholder="請輸入地址">
        </div>
      </div>
    </section>

    <!-- 收件人資訊 -->
    <section class="bg-white rounded-xl shadow p-4 mt-4">
      <h3 class="font-bold text-amber-800 mb-3">收件人資訊</h3>
      <label class="flex items-center gap-2 mb-3 cursor-pointer">
        <input type="checkbox" id="same-as-buyer" checked class="w-5 h-5 rounded text-amber-500 focus:ring-amber-500">
        <span class="text-sm text-gray-700">同訂購人</span>
      </label>
      <div id="receiver-fields" class="space-y-3 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">收件人姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="receiver-name" class="form-input" placeholder="請輸入收件人姓名">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">收件人電話 <span class="text-red-500">*</span></label>
          <input type="tel" id="receiver-phone" class="form-input" placeholder="例：0912345678">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">收件地址 <span class="text-red-500">*</span></label>
          <input type="text" id="receiver-address" class="form-input" placeholder="請輸入收件地址">
        </div>
      </div>
    </section>

    <!-- 送貨時段 -->
    <section class="bg-white rounded-xl shadow p-4 mt-4">
      <h3 class="font-bold text-amber-800 mb-3">送貨時段</h3>
      <div class="flex gap-3">
        <label class="radio-card">
          <input type="radio" name="delivery-time" value="不指定" checked class="hidden peer">
          <span class="radio-label peer-checked:bg-amber-500 peer-checked:text-white">不指定</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="delivery-time" value="上午" class="hidden peer">
          <span class="radio-label peer-checked:bg-amber-500 peer-checked:text-white">上午</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="delivery-time" value="下午" class="hidden peer">
          <span class="radio-label peer-checked:bg-amber-500 peer-checked:text-white">下午</span>
        </label>
      </div>
      <p class="text-xs text-gray-400 mt-2">備註盡可能跟物流說，但一切按物流安排</p>
    </section>

    <!-- 付款方式 -->
    <section class="bg-white rounded-xl shadow p-4 mt-4">
      <h3 class="font-bold text-amber-800 mb-3">付款方式 <span class="text-red-500">*</span></h3>
      <div class="flex gap-3">
        <label class="radio-card flex-1">
          <input type="radio" name="payment-method" value="匯款" checked class="hidden peer">
          <span class="radio-label w-full text-center peer-checked:bg-amber-500 peer-checked:text-white">匯款</span>
        </label>
        <label class="radio-card flex-1">
          <input type="radio" name="payment-method" value="現金付款" class="hidden peer">
          <span class="radio-label w-full text-center peer-checked:bg-amber-500 peer-checked:text-white">現金付款</span>
        </label>
      </div>

      <!-- 匯款資訊（付款方式=匯款 時顯示） -->
      <div id="bank-info" class="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-3">
        <h4 class="font-semibold text-amber-800 text-sm mb-2">匯款帳號</h4>
        <div id="bank-details" class="text-sm text-gray-700 space-y-1">
          <p>銀行：<span id="bank-name-display">-</span> <span id="bank-branch-display"></span></p>
          <p>帳號：<span id="bank-account-display">-</span></p>
          <p>戶名：<span id="bank-holder-display">-</span></p>
        </div>
        <p id="payment-note-display" class="text-xs text-amber-600 mt-2"></p>
        <div class="mt-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">匯款後五碼 <span class="text-red-500">*</span></label>
          <input type="text" id="bank-code" class="form-input" placeholder="帳號末五碼" maxlength="5" inputmode="numeric">
        </div>
      </div>
    </section>

    <!-- 備註 -->
    <section class="bg-white rounded-xl shadow p-4 mt-4">
      <h3 class="font-bold text-amber-800 mb-3">備註</h3>
      <textarea id="order-note" class="form-input h-20 resize-none" placeholder="有什麼需要備註的嗎？（選填）"></textarea>
    </section>

    <!-- 錯誤訊息 -->
    <div id="order-error" class="hidden bg-red-50 text-red-700 p-3 rounded-lg mt-4 text-sm"></div>

    <!-- 送出按鈕 -->
    <button id="submit-btn" onclick="submitOrder()" class="w-full mt-6 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition-colors min-h-[48px]">
      送出訂單
    </button>
  </main>

  <!-- ==================== 訂單成功 ==================== -->
  <div id="section-success" class="hidden px-4 py-6 max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow p-6 text-center">
      <div class="text-5xl mb-3">✅</div>
      <h2 class="text-xl font-bold text-amber-800 mb-2">訂單已送出！</h2>
      <p class="text-gray-600 mb-1">訂單編號：<span id="success-order-id" class="font-mono font-bold"></span></p>
      <p class="text-gray-600 mb-4">訂單總額：<span id="success-total" class="font-bold text-amber-700"></span></p>
      <div id="success-bank-info" class="bg-amber-50 rounded-lg p-4 text-left text-sm mb-4">
        <p class="font-semibold text-amber-800 mb-2">請匯款至以下帳戶：</p>
        <div id="success-bank-details"></div>
      </div>
      <div class="flex gap-3">
        <button onclick="resetForm()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition-colors min-h-[48px]">繼續訂購</button>
        <button onclick="switchTab('query')" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition-colors min-h-[48px]">查詢訂單</button>
      </div>
    </div>
  </div>

  <!-- ==================== 查詢區 ==================== -->
  <section id="section-query" class="hidden px-4 py-6 max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow p-4">
      <h3 class="font-bold text-amber-800 mb-3">輸入電話號碼查詢訂單</h3>
      <div class="flex gap-2">
        <input type="tel" id="query-phone" class="form-input flex-1" placeholder="例：0912345678">
        <button id="query-btn" onclick="queryOrders()" class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold px-6 rounded-xl transition-colors min-h-[48px] whitespace-nowrap">
          查詢
        </button>
      </div>
    </div>

    <!-- 查詢結果 -->
    <div id="query-loading" class="hidden mt-4">
      <div class="bg-white rounded-xl p-4 shadow animate-pulse">
        <div class="h-5 bg-gray-200 rounded w-1/2 mb-3"></div>
        <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
      </div>
    </div>

    <div id="query-error" class="hidden bg-red-50 text-red-700 p-4 rounded-xl mt-4 text-center text-sm"></div>
    <div id="query-empty" class="hidden bg-gray-50 text-gray-500 p-4 rounded-xl mt-4 text-center text-sm">查無訂單紀錄</div>
    <div id="query-results" class="space-y-4 mt-4"></div>
  </section>

  <footer class="text-center text-xs text-gray-400 py-6 px-4">
    如有問題請直接聯繫我們
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
